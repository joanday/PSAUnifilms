name: PSAUnifilms
description: PSAUnifilms - University Film Streaming App

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^18.0.1

  youtube_player_flutter: ^9.1.1
  video_player: ^2.8.1
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  go_router: ^13.0.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  file_picker: ^8.1.2
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  google_generative_ai: ^0.4.7
  youtube_explode_dart: ^3.1.0
  chewie: ^1.13.1
  firebase_storage: ^13.4.6

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/psaulogo.png
    - assets/images/app_icon.png
    - assets/service_account.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
name: PSAUnifilms
description: PSAUnifilms - University Film Streaming App

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^18.0.1

  video_player: ^2.8.1
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  go_router: ^13.0.0
  provider: ^6.1.1
  google_fonts: ^6.1.0
  file_picker: ^8.1.2
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  google_generative_ai: any
  youtube_player_iframe: ^5.1.2
  chewie: ^1.13.1
  firebase_storage: ^13.4.6
  url_launcher: ^6.3.2
  youtube_explode_dart: ^3.1.0
  webview_flutter: ^4.14.1
  tus_client_dart: ^2.5.0
  crypto: ^3.0.7
  cloud_functions: ^6.4.0
  cross_file: ^0.3.5+5
  image_picker: ^1.2.3
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/psaulogo.png
    - assets/service_account.json
    - assets/images/app_icon.png
    - assets/images/app_icon_padded.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_padded.png"
  adaptive_icon_background: "#1F3413"
  adaptive_icon_foreground: "assets/images/app_icon_padded.png"

flutter_native_splash:
  color: "#1F3413"
  image: "assets/images/app_icon_padded.png"
  android: true
  ios: true
  web: true
  android_12:
    color: "#1F3413"
    image: "assets/images/app_icon_padded.png"